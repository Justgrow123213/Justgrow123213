<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Multi-Agent System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 20px;
        }
        .chat-container {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .user-message {
            background-color: #f1f0f0;
            padding: 8px 12px;
            border-radius: 15px;
            margin-bottom: 10px;
            max-width: 80%;
            align-self: flex-end;
            margin-left: auto;
        }
        .agent-message {
            background-color: #e3f2fd;
            padding: 8px 12px;
            border-radius: 15px;
            margin-bottom: 10px;
            max-width: 80%;
        }
        .property-card {
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Real Estate Multi-Agent System</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="h5 mb-0">Chat with Sales Agent</h2>
                    </div>
                    <div class="card-body">
                        <div class="chat-container" id="chatContainer">
                            <div class="agent-message">
                                Hello! I'm Alex, your real estate assistant. How can I help you find your dream property today?
                            </div>
                        </div>
                        <div class="input-group">
                            <input type="text" id="userMessage" class="form-control" placeholder="Type your message...">
                            <button class="btn btn-primary" id="sendButton">Send</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="h5 mb-0">Property Search</h2>
                    </div>
                    <div class="card-body">
                        <form id="propertySearchForm">
                            <div class="row mb-3">
                                <div class="col">
                                    <label for="location" class="form-label">Location</label>
                                    <input type="text" class="form-control" id="location" placeholder="City, neighborhood">
                                </div>
                                <div class="col">
                                    <label for="propertyType" class="form-label">Property Type</label>
                                    <select class="form-select" id="propertyType">
                                        <option value="">Any</option>
                                        <option value="House">House</option>
                                        <option value="Condo">Condo</option>
                                        <option value="Townhouse">Townhouse</option>
                                        <option value="Apartment">Apartment</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col">
                                    <label for="minPrice" class="form-label">Min Price</label>
                                    <input type="number" class="form-control" id="minPrice" placeholder="Min price">
                                </div>
                                <div class="col">
                                    <label for="maxPrice" class="form-label">Max Price</label>
                                    <input type="number" class="form-control" id="maxPrice" placeholder="Max price">
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col">
                                    <label for="bedrooms" class="form-label">Bedrooms</label>
                                    <select class="form-select" id="bedrooms">
                                        <option value="">Any</option>
                                        <option value="1">1+</option>
                                        <option value="2">2+</option>
                                        <option value="3">3+</option>
                                        <option value="4">4+</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label for="bathrooms" class="form-label">Bathrooms</label>
                                    <select class="form-select" id="bathrooms">
                                        <option value="">Any</option>
                                        <option value="1">1+</option>
                                        <option value="2">2+</option>
                                        <option value="3">3+</option>
                                    </select>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Search Properties</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <h3>Property Results</h3>
                <div id="propertyResults" class="row">
                    <!-- Property results will be displayed here -->
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatContainer = document.getElementById('chatContainer');
            const userMessageInput = document.getElementById('userMessage');
            const sendButton = document.getElementById('sendButton');
            const propertySearchForm = document.getElementById('propertySearchForm');
            const propertyResults = document.getElementById('propertyResults');
            
            // Send message when Send button is clicked
            sendButton.addEventListener('click', sendMessage);
            
            // Send message when Enter key is pressed
            userMessageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // Handle property search form submission
            propertySearchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                searchProperties();
            });
            
            function sendMessage() {
                const message = userMessageInput.value.trim();
                if (message === '') return;
                
                // Add user message to chat
                addMessageToChat(message, 'user');
                
                // Clear input field
                userMessageInput.value = '';
                
                // Send message to API
                fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                })
                .then(response => response.json())
                .then(data => {
                    // Add agent response to chat
                    addMessageToChat(data.response, 'agent');
                })
                .catch(error => {
                    console.error('Error:', error);
                    addMessageToChat('Sorry, there was an error processing your request.', 'agent');
                });
            }
            
            function addMessageToChat(message, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = sender === 'user' ? 'user-message' : 'agent-message';
                messageDiv.textContent = message;
                
                chatContainer.appendChild(messageDiv);
                
                // Scroll to bottom of chat
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
            
            function searchProperties() {
                // Get form values
                const location = document.getElementById('location').value;
                const propertyType = document.getElementById('propertyType').value;
                const minPrice = document.getElementById('minPrice').value;
                const maxPrice = document.getElementById('maxPrice').value;
                const bedrooms = document.getElementById('bedrooms').value;
                const bathrooms = document.getElementById('bathrooms').value;
                
                // Create query object
                const query = {
                    location: location || null,
                    property_type: propertyType || null,
                    min_price: minPrice ? parseFloat(minPrice) : null,
                    max_price: maxPrice ? parseFloat(maxPrice) : null,
                    bedrooms: bedrooms ? parseInt(bedrooms) : null,
                    bathrooms: bathrooms ? parseInt(bathrooms) : null
                };
                
                // Send query to API
                fetch('/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(query)
                })
                .then(response => response.json())
                .then(properties => {
                    displayPropertyResults(properties);
                })
                .catch(error => {
                    console.error('Error:', error);
                    propertyResults.innerHTML = '<p class="text-danger">Error fetching properties.</p>';
                });
            }
            
            function displayPropertyResults(properties) {
                if (properties.length === 0) {
                    propertyResults.innerHTML = '<p>No properties found matching your criteria.</p>';
                    return;
                }
                
                let html = '';
                
                properties.forEach(property => {
                    html += `
                        <div class="col-md-6 col-lg-4">
                            <div class="card property-card">
                                <div class="card-body">
                                    <h5 class="card-title">${property.location}</h5>
                                    <h6 class="card-subtitle mb-2 text-muted">$${property.price.toLocaleString()} - ${property.property_type}</h6>
                                    <p class="card-text">
                                        ${property.bedrooms} bed | ${property.bathrooms} bath | ${property.area} ${property.area_unit || 'sq ft'}
                                    </p>
                                    <p class="card-text">${property.description || ''}</p>
                                    <div class="d-flex flex-wrap">
                                        ${property.features ? property.features.map(feature => 
                                            `<span class="badge bg-info text-dark me-1 mb-1">${feature}</span>`
                                        ).join('') : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                propertyResults.innerHTML = html;
            }
        });
    </script>
</body>
</html>
